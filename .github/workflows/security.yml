name: Security Scans
on:
  push:
  pull_request:
  workflow_dispatch:

# Every job is expected to FIND issues; continue-on-error keeps the fixture
# from failing the pipeline outright.
jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (SAST)
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/cpp
            p/c
            p/secrets
            semgrep-rules/tigergate-cpp.yml

  sast-flawfinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flawfinder (C/C++ SAST)
        continue-on-error: true
        run: |
          pip install flawfinder
          flawfinder --sarif src/ > flawfinder.sarif || true
      - uses: actions/upload-artifact@v4
        with: { name: flawfinder-sarif, path: flawfinder.sarif }

  sast-cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cppcheck
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --enable=all --inconclusive --std=c++17 --xml src/ 2> cppcheck.xml || true
      - uses: actions/upload-artifact@v4
        with: { name: cppcheck-xml, path: cppcheck.xml }

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (secrets)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2

  sca-trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (SCA + secrets + misconfig + license)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig,license
          format: sarif
          output: trivy-fs.sarif
      - uses: actions/upload-artifact@v4
        with: { name: trivy-fs-sarif, path: trivy-fs.sarif }

  iac-checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (IaC)
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: cli

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (Dockerfile)
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - name: Build image
        continue-on-error: true
        run: docker build -t tigergate-test-cpp:ci .
      - name: Trivy image (container CVEs)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: tigergate-test-cpp:ci
          format: table

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/bom.cdx.json
      - name: Scan SBOM with Grype
        continue-on-error: true
        uses: anchore/scan-action@v3
        with:
          sbom: sbom/bom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom/ }
