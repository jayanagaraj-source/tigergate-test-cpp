name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev libsqlite3-dev
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: ASan probes (expected to abort)
        continue-on-error: true
        run: make asan
